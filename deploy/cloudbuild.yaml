steps:
  # 1. Validate required environment variables.
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        if [ -z "$GCP_PROJECT" ] || [ -z "$GWAYA_LAKE_BUCKET" ]; then
          echo "ERROR: GCP_PROJECT and GWAYA_LAKE_BUCKET env vars are required"
          exit 1
        fi
  # 2. Restore the exact working tree that was backed up to the data lake (build context).
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        gcloud storage cp "gs://${GWAYA_LAKE_BUCKET}/code/code_latest.tar.gz" /workspace/code.tar.gz &&
        tar xzf /workspace/code.tar.gz -C /workspace && rm /workspace/code.tar.gz
  # 3. Build.
  - name: gcr.io/cloud-builders/docker
    args: [build, -f, deploy/Dockerfile, -t, "${_IMAGE}", .]
  # 4. Push to Artifact Registry.
  - name: gcr.io/cloud-builders/docker
    args: [push, "${_IMAGE}"]
  # 5. Export a tarball to the data lake so a restart never depends on the registry.
  - name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args: ["-c", "docker save ${_IMAGE} | gzip -1 > /workspace/gwaya-bench.tar.gz"]
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args: [storage, cp, /workspace/gwaya-bench.tar.gz, "gs://${GWAYA_LAKE_BUCKET}/images/gwaya-bench.tar.gz"]
substitutions:
  _IMAGE: ${GCP_PROJECT}-docker.pkg.dev/${GCP_PROJECT}/gwaya-bench/runner:v1
options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
timeout: 2400s
