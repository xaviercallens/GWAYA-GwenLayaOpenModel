[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gwaya"
version = "3.1.1"
description = "GWAYA: Fail-Closed Gate & Real Toolchain Verification for LLM Code Generation"
readme = "README.md"
authors = [{ name = "Xavier Callens", email = "callensxavier@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = [
    "llm",
    "verification",
    "fail-closed",
    "formal-verification",
    "lean4",
    "rust",
    "code-generation",
    "mcp",
    "qwen",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Compilers",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "fastmcp>=0.1.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]
benchmark = [
    "pandas>=2.0.0",
    "pyarrow>=12.0.0",
]

[project.urls]
Homepage = "https://github.com/xaviercallens/GWAYA-GwenLayaOpenModel"
Zenodo = "https://doi.org/10.5281/zenodo.23123923"
HuggingFace = "https://huggingface.co/datasets/callensxavier/gwaya-v3-verified-report"
Repository = "https://github.com/xaviercallens/GWAYA-GwenLayaOpenModel.git"

[project.scripts]
gwaya-mcp = "mcp_server:mcp.run"
