[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gwaya"
version = "3.2.0"
description = "GWAYA: Fail-Closed Gate & Real Toolchain Verification for LLM Code Generation"
readme = "README.md"
authors = [{ name = "Xavier Callens", email = "callensxavier@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = [
    "llm",
    "verification",
    "fail-closed",
    "formal-verification",
    "lean4",
    "rust",
    "code-generation",
    "mcp",
    "qwen",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Compilers",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "fastmcp>=0.1.0",
    "requests>=2.28.0",
    "pyflakes>=3.0.0",
]

[project.optional-dependencies]
math = [
    "sympy>=1.12",
]
web = [
    "fastapi>=0.100.0",
    "uvicorn>=0.24.0",
    "chromadb>=0.4.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-playwright>=0.4.0",
    "playwright>=1.40.0",
]
e2e = [
    "pytest>=7.0.0",
    "pytest-playwright>=0.4.0",
    "playwright>=1.40.0",
]
benchmark = [
    "pandas>=2.0.0",
    "pyarrow>=12.0.0",
    "huggingface_hub",
]

train = [
    "torch>=2.3",
    "transformers>=4.50",
    "peft>=0.13",
    "trl>=0.19",
    "datasets>=2.20",
    "bitsandbytes>=0.43",
    "accelerate>=0.30",
    "safetensors>=0.4",
]

[project.urls]
Homepage = "https://github.com/xaviercallens/GWAYA-GwenLayaOpenModel"
Zenodo = "https://doi.org/10.5281/zenodo.23123923"
HuggingFace = "https://huggingface.co/datasets/callensxavier/gwaya-v3-verified-report"
Repository = "https://github.com/xaviercallens/GWAYA-GwenLayaOpenModel.git"

[project.scripts]
gwaya-mcp = "mcp_server:mcp.run"
gwaya-agent = "gwaya.agent:main"

[tool.setuptools]
py-modules = ["mcp_server"]

[tool.setuptools.packages.find]
include = ["gwaya*", "webgwaya*"]
