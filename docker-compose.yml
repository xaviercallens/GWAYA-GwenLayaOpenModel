version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    container_name: gwaya-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_NUM_PARALLEL=2

  # GWAYA Verification Agent & MCP Server
  gwaya-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gwaya-agent
    depends_on:
      - ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434
    volumes:
      - ./results:/app/results
    # bwrap requires user namespaces & unconfined seccomp in container
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
    cap_add:
      - SYS_ADMIN
    command: ["python", "-m", "gwaya.agent", "doctor"]

volumes:
  ollama_models:
